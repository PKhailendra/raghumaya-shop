          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Export job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      jobId: { type: string, format: uuid }
                      status: { type: string, example: COMPLETED }
                      fileUrl: { type: string, example: 'https://s3…/exports/revenue-2026-09.csv?expires=…' }
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/settings:
    get:
      tags: [Admin]
      operationId: adminGetSettings
      summary: Read platform settings (settings.read)
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: sms.provider }
                        value: {}
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Admin]
      operationId: adminUpdateSettings
      summary: Update a platform setting (Super Admin; settings.update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { type: string, example: sms.provider }
                value: { example: msg91 }
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      key: { type: string, example: sms.provider }
                      value: { example: msg91 }
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/security/login-history:
    get:
      tags: [Admin]
      operationId: adminLoginHistory
      summary: Admin login attempts (login_history.read)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: email
          in: query
          schema: { type: string }
        - name: adminId
          in: query
          schema: { type: string, format: uuid }
        - name: success
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Login history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoginHistoryEntry'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/security/devices:
    get:
      tags: [Admin]
      operationId: adminListDevices
      summary: Admin device inventory (devices.manage)
      parameters:
        - name: adminId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived JWT access token (15 min). Obtain via POST /auth/login or /auth/refresh.
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    FromDate:
      name: fromDate
      in: query
      schema: { type: string, format: date, example: '2026-09-01' }
    ToDate:
      name: toDate
      in: query
      schema: { type: string, format: date, example: '2026-09-30' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Honored on POST /billing/invoices, /billing/payments, /purchases, /subscriptions/change. Retries with the same key return the original response.
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacking the required role/permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (duplicate unique key, insufficient stock, downgrade blocked)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Dependency (database/redis) unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: 'quantity must be a positive number' }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 128 }
    HealthStatus:
      type: object
      properties:
        status: { type: string, example: ok }
        checks:
          type: object
          properties:
            database: { type: string, example: ok }
            redis: { type: string, example: ok }
    AccountStatus:
      type: string
      enum: [ACTIVE, PENDING, SUSPENDED, BLOCKED]
    UserRole:
      type: string
      enum: [OWNER, MANAGER, CASHIER, ACCOUNTANT, INVENTORY_STAFF, STAFF]
    AdminRole:
      type: string
      enum: [SUPER_ADMIN, ADMIN, SUPPORT_EXECUTIVE, FINANCE_MANAGER, READ_ONLY_AUDITOR]
    InvoiceStatus:
      type: string
      enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, CANCELLED]
    PaymentMode:
      type: string
      enum: [CASH, UPI, CARD, BANK_TRANSFER, CHEQUE]
    StockMovementType:
      type: string
      enum: [IN, OUT, TRANSFER_IN, TRANSFER_OUT, ADJUSTMENT, PURCHASE, SALE]
    SubscriptionStatus:
      type: string
      enum: [TRIAL, ACTIVE, CANCELLED, EXPIRED]
    PlanCode:
      type: string
      enum: [FREE, STARTER, PROFESSIONAL, ENTERPRISE]

    # ---- Auth ----
    RegisterShopOwnerRequest:
      type: object
      required: [shopName, fullName, phone, password]
      properties:
        shopName: { type: string, example: 'Raghu Maya General Store' }
        fullName: { type: string, example: 'Raghu Prasad' }
        phone: { type: string, example: '9999999999' }
        email: { type: string, format: email, example: owner@demo.shop }
        password: { type: string, format: password, example: 'Owner@123' }
        gstNumber: { type: string, example: 33AAAAA0000A1Z5 }
        city: { type: string, example: Chennai }
        state: { type: string, example: 'Tamil Nadu' }
        referralCode: { type: string, example: RMS-ABCD1234 }
    RegisterShopOwnerResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accountId: { type: string, format: uuid }
            shopId: { type: string, format: uuid }
            accessToken: { type: string }
            refreshToken: { type: string }
            activeShopId: { type: string, format: uuid }
            shops:
              type: array
              items: { $ref: '#/components/schemas/MyShop' }
    RegisterShopUserRequest:
      type: object
      required: [fullName, phone, password, role]
      properties:
        fullName: { type: string, example: 'Cashier User' }
        phone: { type: string, example: '9999999998' }
        email: { type: string, format: email }
        password: { type: string, format: password, example: 'Cashier@123' }
        role: { $ref: '#/components/schemas/UserRole' }
    LoginRequest:
      type: object
      required: [emailOrPhone, password]
      properties:
        emailOrPhone: { type: string, example: owner@demo.shop }
        password: { type: string, format: password, example: 'Owner@123' }
    LoginResponse:
      type: object
      properties:
        data:
          oneOf:
            - type: object
              title: LoginSuccess
              properties:
                accessToken: { type: string }
                refreshToken: { type: string }
                activeShopId: { type: string, format: uuid }
                actorType: { type: string, example: SHOP_USER }
                shops:
                  type: array
                  items: { $ref: '#/components/schemas/MyShop' }
            - type: object
              title: TwoFactorChallenge
              properties:
                twoFactorRequired: { type: boolean, example: true }
                challengeToken: { type: string, example: ch_01J9… }
                methods: { type: array, items: { type: string }, example: [AUTHENTICATOR, SMS] }
                expiresAt: { type: string, format: date-time }
    TokenPair:
      type: object
      properties:
        data:
          type: object
          required: [accessToken, refreshToken]
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
        allDevices: { type: boolean, default: false }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, example: 'NewOwner@456' }
    ForgotPasswordRequest:
      type: object
      required: [emailOrPhone]
      properties:
        emailOrPhone: { type: string, example: owner@demo.shop }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, example: 'Reset@789' }
    OtpRequest:
      type: object
      required: [emailOrPhone]
      properties:
        emailOrPhone: { type: string, example: '9999999999' }
        channel: { type: string, enum: [SMS, EMAIL], default: SMS }
    OtpVerifyRequest:
      type: object
      required: [emailOrPhone, code]
      properties:
        emailOrPhone: { type: string, example: '9999999999' }
        code: { type: string, example: '483920' }
    CreateAdminRequest:
      type: object
      required: [fullName, email, password, role]
      properties:
        fullName: { type: string, example: 'Support Lead' }
        email: { type: string, format: email, example: support@raghumaya.shop }
        password: { type: string, format: password, example: 'Support@123' }
        role: { $ref: '#/components/schemas/AdminRole' }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string, example: "Prasad's Phone" }
        deviceType: { type: string, example: mobile }
        platform: { type: string, example: Android }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }

    # ---- Shops ----
    Shop:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 'Raghu Maya General Store' }
        legalName: { type: string, nullable: true }
        gstNumber: { type: string, nullable: true, example: 33AAAAA0000A1Z5 }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        addressLine1: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        country: { type: string, example: India }
        status: { type: string, example: ACTIVE }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MyShop:
      type: object
      properties:
        shopId: { type: string, format: uuid }
        shopName: { type: string, example: 'Raghu Maya General Store' }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { type: string, example: ACTIVE }
        isPrimaryOwner: { type: boolean, example: true }
        permissions: { type: array, items: { type: string }, example: ['*'] }
    CreateShopRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 180, example: 'Maya Fashion' }
        legalName: { type: string }
        gstNumber: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string, default: India }
    UpdateShopRequest:
      type: object
      properties:
        name: { type: string }
        legalName: { type: string }
        gstNumber: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        addressLine1: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
    ShopMembership:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        fullName: { type: string, example: 'Cashier User' }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { type: string, example: ACTIVE }
        isPrimaryOwner: { type: boolean }
        permissions: { type: array, items: { type: string }, nullable: true }
        invitedById: { type: string, format: uuid, nullable: true }
        joinedAt: { type: string, format: date-time, nullable: true }
        lastAccessedAt: { type: string, format: date-time, nullable: true }
    InviteMemberRequest:
      type: object
      required: [fullName, phone, role]
      properties:
        fullName: { type: string, example: 'Cashier User' }
        phone: { type: string, example: '9999999998' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        permissions: { type: array, items: { type: string }, example: [CUSTOMER_VIEW, ORDER_CREATE, INVOICE_CREATE] }
    UpdateMemberRequest:
      type: object
      properties:
        role: { $ref: '#/components/schemas/UserRole' }
        status: { type: string, enum: [ACTIVE, SUSPENDED, BLOCKED] }
        permissions: { type: array, items: { type: string } }

    # ---- Inventory ----
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        name: { type: string, example: Groceries }
        parentId: { type: string, format: uuid, nullable: true }
        sortOrder: { type: integer, example: 0 }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Groceries }
        parentId: { type: string, format: uuid, nullable: true }
        sortOrder: { type: integer, default: 0 }
    Brand:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        name: { type: string, example: Aachi }
    ProductImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, example: 'https://example.com/rice-front.jpg' }
        isPrimary: { type: boolean, example: true }
        sortOrder: { type: integer, example: 0 }
    ProductVariant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 10kg }
        sku: { type: string, example: RICE-10KG }
        barcode: { type: string, nullable: true }
        qrCode: { type: string, nullable: true }
        attributes: { type: object, example: { weight: 10kg } }
        purchasePrice: { type: string, nullable: true, example: '450.00' }
        sellingPrice: { type: string, nullable: true, example: '520.00' }
        currentStock: { type: string, example: '0' }
    ProductBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        batchNumber: { type: string, example: BATCH-JUN-2026 }
        manufacturedDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true, example: '2026-12-31' }
        quantity: { type: string, example: '40' }
        purchasePrice: { type: string, example: '1100.00' }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        brandId: { type: string, format: uuid, nullable: true }
        name: { type: string, example: 'Premium Rice 25kg' }
        sku: { type: string, example: RICE-25KG }
        barcode: { type: string, nullable: true, example: '8900000000012' }
        qrCode: { type: string, nullable: true, example: 'RMS:RICE-25KG' }
        description: { type: string, nullable: true }
        unit: { type: string, example: bag }
        purchasePrice: { type: string, example: '1100.00' }
        sellingPrice: { type: string, example: '1250.00' }
        taxRate: { type: string, example: '5.00' }
        currentStock: { type: string, example: '40' }
        reorderLevel: { type: string, example: '10' }
        imageUrl: { type: string, nullable: true }
        isActive: { type: boolean, example: true }
        images: { type: array, items: { $ref: '#/components/schemas/ProductImage' } }
        variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } }
        batches: { type: array, items: { $ref: '#/components/schemas/ProductBatch' } }
    CreateProductRequest:
      type: object
      required: [name, unit, purchasePrice, sellingPrice]
      properties:
        categoryId: { type: string, format: uuid }
        brandId: { type: string, format: uuid }
        name: { type: string, example: 'Premium Rice 25kg' }
        sku: { type: string, example: RICE-25KG }
        barcode: { type: string, example: '8900000000012' }
        qrCode: { type: string, example: 'RMS:RICE-25KG' }
        description: { type: string }
        unit: { type: string, example: bag }
        purchasePrice: { type: string, example: '1100.00' }
        sellingPrice: { type: string, example: '1250.00' }
        taxRate: { type: string, default: '0.00', example: '5.00' }
        currentStock: { type: string, default: '0' }
        reorderLevel: { type: string, default: '0' }
        imageUrl: { type: string }
        images:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
              isPrimary: { type: boolean, default: false }
              sortOrder: { type: integer, default: 0 }
        variants:
          type: array
          items:
            type: object
            required: [name, sku]
            properties:
              name: { type: string }
              sku: { type: string }
              barcode: { type: string }
              qrCode: { type: string }
              attributes: { type: object }
              sellingPrice: { type: string }
        batches:
          type: array
          items:
            type: object
            required: [batchNumber, quantity]
            properties:
              batchNumber: { type: string }
              expiryDate: { type: string, format: date }
              manufacturedDate: { type: string, format: date }
              quantity: { type: string }
              purchasePrice: { type: string }
    UpdateProductRequest:
      type: object
      properties:
        name: { type: string }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        qrCode: { type: string, nullable: true }
        description: { type: string }
        unit: { type: string }
        purchasePrice: { type: string }
        sellingPrice: { type: string }
        taxRate: { type: string }
        reorderLevel: { type: string }
        imageUrl: { type: string }
        isActive: { type: boolean }
        categoryId: { type: string, format: uuid, nullable: true }
        brandId: { type: string, format: uuid, nullable: true }

    # ---- Stock ----
    Warehouse:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        name: { type: string, example: 'Main Godown' }
        code: { type: string, example: GD-01 }
        address: { type: string, nullable: true }
        isDefault: { type: boolean, example: true }
    StockLevel:
      type: object
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        warehouseName: { type: string, example: 'Main Godown' }
        productId: { type: string, format: uuid }
        productName: { type: string, example: 'Premium Rice 25kg' }
        variantId: { type: string, format: uuid, nullable: true }
        batchId: { type: string, format: uuid, nullable: true }
        quantity: { type: string, example: '40' }
        reservedQuantity: { type: string, example: '0' }
    StockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid, nullable: true }
        productId: { type: string, format: uuid }
        variantId: { type: string, format: uuid, nullable: true }
        batchId: { type: string, format: uuid, nullable: true }
        movementType: { $ref: '#/components/schemas/StockMovementType' }
        quantity: { type: string, example: '25' }
        unitCost: { type: string, nullable: true, example: '100.00' }
        referenceType: { type: string, nullable: true, example: MANUAL }
        referenceId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        createdById: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    StockAlert:
      type: object
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string, example: 'Premium Rice 25kg' }
        variantId: { type: string, format: uuid, nullable: true }
        currentStock: { type: string, example: '2' }
        reorderLevel: { type: string, example: '10' }
        warehouseId: { type: string, format: uuid, nullable: true }
    ExpiryAlert:
      type: object
      properties:
        batchId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string, example: 'Premium Rice 25kg' }
        batchNumber: { type: string, example: BATCH-JUN-2026 }
        expiryDate: { type: string, format: date, example: '2026-12-31' }
        daysToExpiry: { type: integer, example: 12 }
        quantity: { type: string, example: '40' }
    StockInRequest:
      type: object
      required: [warehouseId, items]
      properties:
        warehouseId: { type: string, format: uuid }
        referenceType: { type: string, default: MANUAL, example: MANUAL }
        referenceId: { type: string, format: uuid }
        note: { type: string, example: 'Monthly restock' }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              batchNumber: { type: string, example: BATCH-JUN-2026 }
              expiryDate: { type: string, format: date }
              manufacturedDate: { type: string, format: date }
              quantity: { type: string, example: '25' }
              unitCost: { type: string, example: '100.00' }
    StockOutRequest:
      type: object
      required: [warehouseId, items]
      properties:
        warehouseId: { type: string, format: uuid }
        referenceType: { type: string, default: MANUAL }
        referenceId: { type: string, format: uuid }
        note: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              batchId: { type: string, format: uuid }
              quantity: { type: string, example: '5' }
    StockTransferRequest:
      type: object
      required: [fromWarehouseId, toWarehouseId, items]
      properties:
        fromWarehouseId: { type: string, format: uuid }
        toWarehouseId: { type: string, format: uuid }
        note: { type: string, example: 'Festival stock shift' }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              batchId: { type: string, format: uuid }
              quantity: { type: string, example: '5' }
    StockTransfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        fromWarehouseId: { type: string, format: uuid }
        toWarehouseId: { type: string, format: uuid }
        status: { type: string, example: COMPLETED }
        note: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: string, example: '5' }
        createdAt: { type: string, format: date-time }

    # ---- Purchases ----
    PurchaseItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string, example: 'Premium Rice 25kg' }
        variantId: { type: string, format: uuid, nullable: true }
        batchNumber: { type: string, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        quantity: { type: string, example: '100' }
        unitCost: { type: string, example: '1050.00' }
        lineTotal: { type: string, example: '105000.00' }
    Purchase:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid, nullable: true }
        supplierName: { type: string, nullable: true }
        purchaseNumber: { type: string, example: PO-2026-0042 }
        purchaseDate: { type: string, format: date }
        totalAmount: { type: string, example: '105000.00' }
        status: { type: string, example: RECEIVED }
        notes: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/PurchaseItem' } }
        createdAt: { type: string, format: date-time }
    CreatePurchaseRequest:
      type: object
      required: [items]
      properties:
        supplierId: { type: string, format: uuid }
        purchaseNumber: { type: string, example: PO-2026-0042 }
        purchaseDate: { type: string, format: date, example: '2026-09-20' }
        warehouseId: { type: string, format: uuid }
        notes: { type: string, example: 'Festival season stock' }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity, unitCost]
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              batchNumber: { type: string, example: BATCH-SEP-2026 }
              expiryDate: { type: string, format: date }
              quantity: { type: string, example: '100' }
              unitCost: { type: string, example: '1050.00' }
    UpdatePurchaseRequest:
      type: object
      properties:
        supplierId: { type: string, format: uuid }
        purchaseNumber: { type: string }
        purchaseDate: { type: string, format: date }
        notes: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: string }
              unitCost: { type: string }

    # ---- Billing ----
    InvoiceItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid, nullable: true }
        variantId: { type: string, format: uuid, nullable: true }
        description: { type: string, example: 'Premium Rice 25kg' }
        hsnCode: { type: string, example: '1006' }
        quantity: { type: string, example: '2' }
        unitPrice: { type: string, example: '1250.00' }
        discountRate: { type: string, example: '5' }
        discountAmount: { type: string, example: '125.00' }
        gstRate: { type: string, example: '5' }
        taxableAmount: { type: string, example: '2375.00' }
        cgstAmount: { type: string, example: '59.38' }
        sgstAmount: { type: string, example: '59.38' }
        igstAmount: { type: string, example: '0.00' }
        lineTotal: { type: string, example: '2493.76' }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, nullable: true }
        customerName: { type: string, nullable: true }
        orderId: { type: string, format: uuid, nullable: true }
        invoiceNumber: { type: string, example: INV-2026-0042 }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        issueDate: { type: string, format: date, example: '2026-09-28' }
        dueDate: { type: string, format: date, nullable: true }
        placeOfSupply: { type: string, nullable: true, example: 'Tamil Nadu' }
        isInterState: { type: boolean, example: false }
        subtotal: { type: string, example: '2500.00' }
        discountTotal: { type: string, example: '125.00' }
        taxableTotal: { type: string, example: '2375.00' }
        cgstTotal: { type: string, example: '59.38' }
        sgstTotal: { type: string, example: '59.38' }
        igstTotal: { type: string, example: '0.00' }
        taxTotal: { type: string, example: '118.76' }
        totalAmount: { type: string, example: '2493.76' }
        paidAmount: { type: string, example: '0.00' }
        pdfUrl: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        terms: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/InvoiceItem' } }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        createdAt: { type: string, format: date-time }
    CreateInvoiceRequest:
      type: object
      required: [items]
      properties:
        customerId: { type: string, format: uuid }
        invoiceNumber: { type: string, example: INV-2026-0001 }
        status: { $ref: '#/components/schemas/InvoiceStatus', default: DRAFT }
        issueDate: { type: string, format: date, example: '2026-09-28' }
        dueDate: { type: string, format: date, example: '2026-10-05' }
        placeOfSupply: { type: string, example: 'Tamil Nadu' }
        customerGstNumber: { type: string, example: 33AAAAA0000A1Z5 }
        isInterState: { type: boolean, default: false }
        notes: { type: string, example: 'Thank you for your business.' }
        terms: { type: string, example: 'Payment due within 7 days.' }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [quantity, unitPrice]
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              description: { type: string, example: 'Premium Rice 25kg' }
              hsnCode: { type: string, example: '1006' }
              quantity: { type: string, example: '2' }
              unitPrice: { type: string, example: '1250.00' }
              discountRate: { type: string, default: '0', example: '5' }
              gstRate: { type: string, default: '0', example: '5' }
    UpdateInvoiceRequest:
      type: object
      properties:
        customerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        placeOfSupply: { type: string }
        isInterState: { type: boolean }
        notes: { type: string }
        terms: { type: string }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        amount: { type: string, example: '2493.76' }
        mode: { $ref: '#/components/schemas/PaymentMode' }
        direction: { type: string, example: IN }
        status: { type: string, example: SUCCESS }
        transactionRef: { type: string, nullable: true, example: UPI-20260928-001 }
        paidAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CreatePaymentRequest:
      type: object
      required: [invoiceId, amount, mode]
      properties:
        invoiceId: { type: string, format: uuid }
        amount: { type: string, example: '2493.76' }
        mode: { $ref: '#/components/schemas/PaymentMode' }
        transactionRef: { type: string, example: UPI-20260928-001 }
        paidAt: { type: string, format: date-time }
        note: { type: string, example: GPay }

    # ---- Customers ----
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        name: { type: string, example: 'Suresh Kumar' }
        phone: { type: string, nullable: true, example: '9777777777' }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        gstNumber: { type: string, nullable: true }
        creditLimit: { type: string, example: '50000.00' }
        outstandingBalance: { type: string, example: '2493.76' }
        createdAt: { type: string, format: date-time }
    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: 'Suresh Kumar' }
        phone: { type: string, example: '9777777777' }
        email: { type: string, format: email }
        address: { type: string }
        gstNumber: { type: string }
        creditLimit: { type: string, default: '0.00', example: '50000.00' }
    UpdateCustomerRequest:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        gstNumber: { type: string }
        creditLimit: { type: string }
    DuePayment:
      type: object
      properties:
        customerId: { type: string, format: uuid }
        customerName: { type: string, example: 'Suresh Kumar' }
        phone: { type: string, nullable: true }
        dueTotal: { type: string, example: '12400.00' }
        invoiceCount: { type: integer, example: 3 }
        oldestDueDate: { type: string, format: date, nullable: true }
    HistoryEntry:
      type: object
      properties:
        date: { type: string, format: date-time }
        kind: { type: string, enum: [INVOICE, PAYMENT], example: INVOICE }
        reference: { type: string, example: INV-2026-0042 }
        amount: { type: string, example: '2493.76' }
        status: { type: string, example: ISSUED }
    CustomerPurchase:
      type: object
      properties:
        invoiceId: { type: string, format: uuid }
        invoiceNumber: { type: string, example: INV-2026-0042 }
        issueDate: { type: string, format: date }
        description: { type: string, example: 'Premium Rice 25kg' }
        quantity: { type: string, example: '2' }
        lineTotal: { type: string, example: '2493.76' }
    CustomerLedger:
      type: object
      properties:
        customerId: { type: string, format: uuid }
        outstandingBalance: { type: string, example: '0.00' }
        entries:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              type: { type: string, enum: [DEBIT, CREDIT], example: DEBIT }
              reference: { type: string, example: INV-2026-0042 }
              debit: { type: string, example: '2493.76' }
              credit: { type: string, example: '0.00' }
              balance: { type: string, example: '2493.76' }
    CustomerReminder:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        channel: { type: string, enum: [SMS, WHATSAPP], example: SMS }
        recipient: { type: string, example: '9777777777' }
        message: { type: string }
        invoiceLink: { type: string, nullable: true }
        status: { type: string, example: SENT }
        createdAt: { type: string, format: date-time }

    # ---- Finance ----
    FinanceCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Rent }
        type: { type: string, enum: [INCOME, EXPENSE] }
    Revenue:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        source: { type: string, example: 'Repair services' }
        amount: { type: string, example: '12000.00' }
        revenueDate: { type: string, format: date }
        note: { type: string, nullable: true }
    CreateRevenueRequest:
      type: object
      required: [amount, revenueDate]
      properties:
        categoryId: { type: string, format: uuid }
        source: { type: string, example: 'Repair services' }
        amount: { type: string, example: '12000.00' }
        revenueDate: { type: string, format: date, example: '2026-09-28' }
        note: { type: string }
    Expense:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        amount: { type: string, example: '12000.00' }
        expenseDate: { type: string, format: date }
        vendorName: { type: string, nullable: true, example: 'City Rentals' }
        note: { type: string, nullable: true }
        receiptUrl: { type: string, nullable: true }
    CreateExpenseRequest:
      type: object
      required: [amount, expenseDate]
      properties:
        categoryId: { type: string, format: uuid }
        amount: { type: string, example: '12000.00' }
        expenseDate: { type: string, format: date, example: '2026-09-01' }
        vendorName: { type: string, example: 'City Rentals' }
        note: { type: string, example: 'September shop rent' }
    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 'Display fridge' }
        assetType: { type: string, example: Equipment }
        purchaseValue: { type: string, example: '85000.00' }
        currentValue: { type: string, nullable: true, example: '70000.00' }
        purchaseDate: { type: string, format: date, nullable: true }
        status: { type: string, example: ACTIVE }
    CreateAssetRequest:
      type: object
      required: [name, assetType, purchaseValue]
      properties:
        name: { type: string, example: 'Display fridge' }
        assetType: { type: string, example: Equipment }
        purchaseValue: { type: string, example: '85000.00' }
        currentValue: { type: string, example: '70000.00' }
        purchaseDate: { type: string, format: date }
        status: { type: string, default: ACTIVE }
    Liability:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 'Business loan — HDFC' }
        liabilityType: { type: string, example: Loan }
        principalAmount: { type: string, example: '500000.00' }
        outstandingAmount: { type: string, example: '120000.00' }
        dueDate: { type: string, format: date, nullable: true }
        status: { type: string, example: ACTIVE }
    CreateLiabilityRequest:
      type: object
      required: [name, liabilityType, principalAmount, outstandingAmount]
      properties:
        name: { type: string, example: 'Business loan — HDFC' }
        liabilityType: { type: string, example: Loan }
        principalAmount: { type: string, example: '500000.00' }
        outstandingAmount: { type: string, example: '120000.00' }
        dueDate: { type: string, format: date }
        status: { type: string, default: ACTIVE }
    FinanceDashboard:
      type: object
      properties:
        data:
          type: object
          properties:
            totalRevenue: { type: string, example: '452300.00' }
            invoiceRevenue: { type: string, example: '440300.00' }
            manualRevenue: { type: string, example: '12000.00' }
            totalExpenses: { type: string, example: '98000.00' }
            grossProfit: { type: string, example: '354300.00' }
            cashIn: { type: string, example: '430000.00' }
            cashOut: { type: string, example: '90000.00' }
            netCashFlow: { type: string, example: '340000.00' }
            assetValue: { type: string, example: '850000.00' }
            outstandingLiabilities: { type: string, example: '120000.00' }
            taxPayable: { type: string, example: '45210.00' }
            cgst: { type: string, example: '21000.00' }
            sgst: { type: string, example: '21000.00' }
            igst: { type: string, example: '3210.00' }

    # ---- Analytics ----
    SalesSeries:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              period: { type: string, example: '2026-09-28' }
              total: { type: string, example: '18250.00' }
              invoiceCount: { type: integer, example: 14 }

    # ---- Subscriptions ----
    SubscriptionPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/PlanCode' }
        name: { type: string, example: Professional }
        monthlyPrice: { type: string, example: '499.00' }
        yearlyPrice: { type: string, example: '4990.00' }
        currency: { type: string, example: INR }
        trialDays: { type: integer, example: 14 }
        limits:
          type: object
          properties:
            users: { type: integer, example: 15 }
            products: { type: integer, example: 5000 }
            customers: { type: integer, example: 10000 }
            invoicesPerMonth: { type: integer, example: 5000 }
            storageMb: { type: integer, example: 10240 }
        features: { type: object }
        isActive: { type: boolean, example: true }
    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        billingCycle: { type: string, example: MONTHLY }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        amount: { type: string, example: '0.00' }
    CurrentSubscription:
      type: object
      properties:
        data:
          type: object
          properties:
            subscription: { $ref: '#/components/schemas/Subscription' }
            plan: { $ref: '#/components/schemas/SubscriptionPlan' }
            usage:
              type: object
              properties:
                users: { type: integer, example: 4 }
                products: { type: integer, example: 25 }
                customers: { type: integer, example: 10 }
                invoicesThisMonth: { type: integer, example: 15 }
    ChangeSubscriptionRequest:
      type: object
      required: [planCode]
      properties:
        planCode: { $ref: '#/components/schemas/PlanCode' }
        billingCycle: { type: string, enum: [MONTHLY, YEARLY], default: MONTHLY }
        startTrial: { type: boolean, default: false }

    # ---- Referrals ----
    ReferralCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: RMS-ABCD1234 }
        isActive: { type: boolean, example: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    Referral:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: RMS-ABCD1234 }
        referredShopId: { type: string, format: uuid, nullable: true }
        status: { type: string, example: CONVERTED }
        rewardAmount: { type: string, nullable: true, example: '500.00' }
        rewardedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Coupon:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: WELCOME500 }
        discountType: { type: string, enum: [FLAT, PERCENT], example: FLAT }
        discountValue: { type: string, example: '500.00' }
        status: { type: string, example: ACTIVE }
        expiresAt: { type: string, format: date-time, nullable: true }
        usedByShopId: { type: string, format: uuid, nullable: true }
        usedAt: { type: string, format: date-time, nullable: true }
    CreateCouponRequest:
      type: object
      required: [code, discountType, discountValue]
      properties:
        code: { type: string, example: WELCOME500 }
        discountType: { type: string, enum: [FLAT, PERCENT] }
        discountValue: { type: string, example: '500.00' }
        expiresAt: { type: string, format: date-time }

    # ---- Notifications ----
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: SUBSCRIPTION }
        title: { type: string, example: 'Trial ending soon' }
        message: { type: string }
        data: { type: object, nullable: true }
        isRead: { type: boolean, example: false }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # ---- Audit ----
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid, nullable: true }
        actorType: { type: string, example: SHOP_USER }
        actorId: { type: string, format: uuid, nullable: true }
        action: { type: string, example: INVOICE_CREATED }
        entityType: { type: string, example: Invoice }
        entityId: { type: string, format: uuid, nullable: true }
        category: { type: string, example: billing }
        severity: { type: string, example: INFO }
        oldValue: { type: object, nullable: true }
        newValue: { type: object, nullable: true }
        metadata: { type: object, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ---- Admin ----
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, example: 'Raghu Prasad' }
        email: { type: string, nullable: true }
        phone: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        phoneVerifiedAt: { type: string, format: date-time, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Admin:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, example: 'Support Lead' }
        email: { type: string, example: support@raghumaya.shop }
        role: { $ref: '#/components/schemas/AdminRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        createdAt: { type: string, format: date-time }
    AdminDashboard:
      type: object
      properties:
        data:
          type: object
          properties:
            shops:
              type: object
              properties:
                total: { type: integer, example: 1240 }
                active: { type: integer, example: 1180 }
                inactive: { type: integer, example: 40 }
                blocked: { type: integer, example: 20 }
                newToday: { type: integer, example: 6 }
                newThisMonth: { type: integer, example: 148 }
            revenue:
              type: object
              properties:
                daily: { type: string, example: '42000.00' }
                weekly: { type: string, example: '280000.00' }
                monthly: { type: string, example: '1150000.00' }
                yearly: { type: string, example: '13200000.00' }
            users:
              type: object
              properties:
                total: { type: integer, example: 5100 }
                active: { type: integer, example: 4900 }
                suspended: { type: integer, example: 60 }
            subscriptions:
              type: object
              properties:
                free: { type: integer, example: 300 }
                starter: { type: integer, example: 420 }
                professional: { type: integer, example: 380 }
                enterprise: { type: integer, example: 80 }
            finance:
              type: object
              properties:
                totalPlatformRevenue: { type: string, example: '13200000.00' }
                pendingPayments: { type: string, example: '85000.00' }
                subscriptionRenewals: { type: integer, example: 96 }
    AdminCreateShopRequest:
      type: object
      required: [shopName, ownerName, ownerPhone]
      properties:
        shopName: { type: string, example: 'New Shop' }
        shopType: { type: string, example: Retail }
        gstNumber: { type: string }
        shopPhone: { type: string }
        shopEmail: { type: string, format: email }
        ownerName: { type: string, example: Owner }
        ownerPhone: { type: string, example: '9888888888' }
        ownerEmail: { type: string, format: email }
        country: { type: string, default: India }
        state: { type: string }
        city: { type: string }
        postalCode: { type: string }
        planCode: { $ref: '#/components/schemas/PlanCode' }
    ApprovalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: PROFILE_CHANGE }
        status: { type: string, example: PENDING }
        shopId: { type: string, format: uuid, nullable: true }
        requestedById: { type: string, format: uuid, nullable: true }
        reviewedById: { type: string, format: uuid, nullable: true }
        oldValue: { type: object, nullable: true }
        requestedValue: { type: object }
        reason: { type: string, nullable: true }
        reviewerComment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
    SupportTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticketNo: { type: string, example: TKT-2026-0091 }
        shopId: { type: string, format: uuid, nullable: true }
        createdById: { type: string, format: uuid, nullable: true }
        assignedToId: { type: string, format: uuid, nullable: true }
        subject: { type: string, example: 'Invoice PDF not generating' }
        description: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string, enum: [OPEN, ASSIGNED, WAITING_ON_CUSTOMER, RESOLVED, CLOSED] }
        resolvedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateTicketRequest:
      type: object
      required: [subject, description]
      properties:
        shopId: { type: string, format: uuid }
        subject: { type: string, example: 'Invoice PDF not generating' }
        description: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL], default: MEDIUM }
    UpdateTicketRequest:
      type: object
      properties:
        subject: { type: string }
        description: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string, enum: [OPEN, ASSIGNED, WAITING_ON_CUSTOMER, RESOLVED, CLOSED] }
        assignedToId: { type: string, format: uuid, nullable: true }
    LoginHistoryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        adminId: { type: string, format: uuid, nullable: true }
        email: { type: string, example: support@raghumaya.shop }
        success: { type: boolean, example: true }
        reason: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        deviceHash: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
