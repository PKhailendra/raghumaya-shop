  /admin/reports/{type}:
    get:
      tags: [Admin]
      operationId: adminGetReport
      summary: Run a platform report — shops, revenue, users, subscriptions, audit (reports.read)
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [shops, revenue, users, subscriptions, audit] }
        - name: format
          in: query
          schema: { type: string, enum: [pdf, xlsx, csv], default: csv }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Report file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports/exports:
    post:
      tags: [Admin]
      operationId: adminCreateExport
      summary: Queue an async report export job (reports.export)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportType, format]
              properties:
                reportType: { type: string, example: revenue }
                format: { type: string, enum: [PDF, EXCEL, CSV] }
                filters:
                  type: object
                  properties:
                    fromDate: { type: string, format: date }
                    toDate: { type: string, format: date }
      responses:
        '202':
          description: Export job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
