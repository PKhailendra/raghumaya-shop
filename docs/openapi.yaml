openapi: 3.1.0
info:
  title: RaghuMayaShop API
  version: 1.0.0
  description: >-
    Multi-tenant SaaS platform API for shop management: auth & 2FA, multi-shop
    memberships, inventory, ledger-first stock, GST billing, customers, finance,
    analytics, subscriptions, referrals, notifications, audit, and platform admin.
    Money is serialized as string; dates are ISO-8601; IDs are UUID v4.
    List endpoints return { data, meta: { page, limit, total } }.
    Errors return { error: { code, message } }.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: TwoFactor
  - name: Shops
  - name: Inventory
  - name: Stock
  - name: Purchases
  - name: Billing
  - name: Customers
  - name: Finance
  - name: Analytics
  - name: Subscriptions
  - name: Referrals
  - name: Notifications
  - name: AuditLogs
  - name: Admin

paths:
  # ---------------------------------------------------------------- Health
  /health/live:
    get:
      tags: [Health]
      security: []
      operationId: healthLive
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      tags: [Health]
      security: []
      operationId: healthReady
      summary: Readiness probe (checks database and redis)
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- Auth
  /auth/register-shop-owner:
    post:
      tags: [Auth]
      security: []
      operationId: registerShopOwner
      summary: Register a new shop and owner account (pending approval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterShopOwnerRequest'
      responses:
        '201':
          description: Shop and owner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterShopOwnerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/shop-users:
    post:
      tags: [Auth]
      operationId: registerShopUser
      summary: Register a staff account for the active shop (Owner/Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterShopUserRequest'
      responses:
        '201':
          description: Staff account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accountId: { type: string, format: uuid }
                      membershipId: { type: string, format: uuid }
                      role: { $ref: '#/components/schemas/UserRole' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      summary: Password login for shop users and platform admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful, or 2FA challenge required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh token, or all device tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked: { type: boolean, example: true }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      operationId: refreshToken
      summary: Rotate refresh token and issue a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change password and revoke other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      changed: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      operationId: forgotPassword
      summary: Request a password reset (always returns accepted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Accepted (no account enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted: { type: boolean, example: true }
  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      operationId: resetPassword
      summary: Reset password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reset: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      operationId: requestOtp
      summary: Send OTP for passwordless login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent: { type: boolean, example: true }
                      channel: { type: string, example: SMS }
                      expiresIn: { type: integer, example: 600 }
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      operationId: verifyOtp
      summary: Verify OTP and issue JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified, tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/email/request-verification:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      summary: Send email verification code to the authenticated user
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent: { type: boolean, example: true }
  /auth/email/verify:
    post:
      tags: [Auth]
      security: []
      operationId: verifyEmail
      summary: Verify email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: '728194' }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/sms/request-verification:
    post:
      tags: [Auth]
      operationId: requestSmsVerification
      summary: Send SMS verification code to the authenticated user
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent: { type: boolean, example: true }
  /auth/sms/verify:
    post:
      tags: [Auth]
      security: []
      operationId: verifySms
      summary: Verify SMS code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: '9999999999' }
                code: { type: string, example: '551203' }
      responses:
        '200':
          description: Phone verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/admins:
    post:
      tags: [Auth]
      operationId: createAdmin
      summary: Create a platform admin account (Super Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '201':
          description: Admin created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Admin'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/devices:
    get:
      tags: [Auth]
      operationId: listDevices
      summary: List the actor's devices
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
  /auth/devices/{id}:
    delete:
      tags: [Auth]
      operationId: removeDevice
      summary: Remove a device and revoke its refresh tokens
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked: { type: boolean, example: true }
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- 2FA
  /auth/2fa/status:
    get:
      tags: [TwoFactor]
      operationId: get2faStatus
      summary: Get 2FA status for the actor
      responses:
        '200':
          description: 2FA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean, example: true }
                      methods: { type: array, items: { type: string }, example: [AUTHENTICATOR, SMS] }
                      hasBackupCodes: { type: boolean, example: true }
  /auth/2fa/methods:
    patch:
      tags: [TwoFactor]
      operationId: update2faMethods
      summary: Update enabled 2FA methods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [methods]
              properties:
                methods: { type: array, items: { type: string, enum: [AUTHENTICATOR, SMS, EMAIL] }, example: [AUTHENTICATOR, EMAIL] }
      responses:
        '200':
          description: Methods updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      methods: { type: array, items: { type: string } }
  /auth/2fa/authenticator/setup:
    post:
      tags: [TwoFactor]
      operationId: setup2faAuthenticator
      summary: Start TOTP authenticator setup (returns secret + QR)
      responses:
        '200':
          description: Setup payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string, example: JBSWY3DPEHPK3PXP }
                      otpauthUrl: { type: string, example: 'otpauth://totp/RaghuMayaShop:owner@demo.shop?secret=JBSWY3DPEHPK3PXP&issuer=RaghuMayaShop' }
                      qrDataUrl: { type: string, example: 'data:image/png;base64,…' }
  /auth/2fa/authenticator/verify:
    post:
      tags: [TwoFactor]
      operationId: verify2faAuthenticator
      summary: Confirm TOTP setup and enable 2FA (returns backup codes once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: '123456' }
      responses:
        '200':
          description: 2FA enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean, example: true }
                      backupCodes: { type: array, items: { type: string }, example: [a1b2-c3d4, e5f6-g7h8] }
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/2fa/backup-codes/regenerate:
    post:
      tags: [TwoFactor]
      operationId: regenerate2faBackupCodes
      summary: Regenerate backup codes (invalidates old ones)
      responses:
        '200':
          description: New backup codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      backupCodes: { type: array, items: { type: string } }
  /auth/2fa/challenge/send:
    post:
      tags: [TwoFactor]
      security: []
      operationId: send2faChallenge
      summary: Send a 2FA challenge code (SMS or EMAIL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, method]
              properties:
                challengeToken: { type: string, example: ch_01J9… }
                method: { type: string, enum: [SMS, EMAIL] }
      responses:
        '200':
          description: Challenge sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/2fa/challenge/verify:
    post:
      tags: [TwoFactor]
      security: []
      operationId: verify2faChallenge
      summary: Verify a 2FA challenge and complete login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, method, code]
              properties:
                challengeToken: { type: string, example: ch_01J9… }
                method: { type: string, enum: [SMS, EMAIL, AUTHENTICATOR, BACKUP_CODE] }
                code: { type: string, example: '123456' }
      responses:
        '200':
          description: Challenge verified, tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ---------------------------------------------------------------- Shops
  /shops:
    post:
      tags: [Shops]
      operationId: createShop
      summary: Create a shop and primary owner membership for the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShopRequest'
      responses:
        '201':
          description: Shop created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Shops]
      operationId: listMyShops
      summary: List shops where the account has an active membership
      responses:
        '200':
          description: Shop list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyShop'
  /shops/switch:
    post:
      tags: [Shops]
      operationId: switchShop
      summary: Switch active shop and re-issue tokens scoped to it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId]
              properties:
                shopId: { type: string, format: uuid }
      responses:
        '200':
          description: New token pair scoped to the selected shop
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
                      refreshToken: { type: string }
                      activeShopId: { type: string, format: uuid }
                      role: { $ref: '#/components/schemas/UserRole' }
                      permissions: { type: array, items: { type: string } }
        '403':
          $ref: '#/components/responses/Forbidden'
  /shops/{id}:
    get:
      tags: [Shops]
      operationId: getShop
      summary: Get shop details (must be a member)
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Shop
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Shop'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Shops]
      operationId: updateShop
      summary: Update shop profile (SHOP_UPDATE permission)
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShopRequest'
      responses:
        '200':
          description: Shop updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Shop'
        '403':
          $ref: '#/components/responses/Forbidden'
  /shops/{id}/members:
    get:
      tags: [Shops]
      operationId: listShopMembers
      summary: List shop memberships (EMPLOYEE_VIEW)
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShopMembership'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '403':
          $ref: '#/components/responses/Forbidden'
  /shops/{id}/members/invite:
    post:
      tags: [Shops]
      operationId: inviteShopMember
      summary: Invite an employee (EMPLOYEE_CREATE)
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: Member invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ShopMembership'
        '403':
          $ref: '#/components/responses/Forbidden'
  /shops/{id}/members/{memberId}:
    patch:
      tags: [Shops]
      operationId: updateShopMember
      summary: Update member role/permissions/status (EMPLOYEE_UPDATE)
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ShopMembership'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Shops]
      operationId: removeShopMember
      summary: Remove a member (EMPLOYEE_DELETE, soft delete)
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      removed: { type: boolean, example: true }
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- Inventory
  /inventory/categories:
    post:
      tags: [Inventory]
      operationId: createCategory
      summary: Create a product category (INVENTORY_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
    get:
      tags: [Inventory]
      operationId: listCategories
      summary: List categories (INVENTORY_VIEW)
      parameters:
        - name: tree
          in: query
          schema: { type: boolean, default: false }
          description: Return nested tree
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
  /inventory/categories/{id}:
    patch:
      tags: [Inventory]
      operationId: updateCategory
      summary: Update a category (INVENTORY_UPDATE)
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Groceries }
                parentId: { type: string, format: uuid, nullable: true }
                sortOrder: { type: integer, example: 1 }
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Inventory]
      operationId: deleteCategory
      summary: Soft delete a category (INVENTORY_DELETE)
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted: { type: boolean, example: true }
        '404':
          $ref: '#/components/responses/NotFound'
  /inventory/brands:
    post:
      tags: [Inventory]
      operationId: createBrand
      summary: Create a brand (INVENTORY_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Aachi }
      responses:
        '201':
          description: Brand created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Brand'
    get:
      tags: [Inventory]
      operationId: listBrands
      summary: List brands (INVENTORY_VIEW)
      responses:
        '200':
          description: Brand list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'
  /inventory/products:
    post:
      tags: [Inventory]
      operationId: createProduct
      summary: Create a product with images, variants, batches (INVENTORY_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '409':
